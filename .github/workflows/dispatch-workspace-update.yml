name: Dispatch Workspace Update & Commit

on:
    workflow_dispatch:
        inputs:
            run_fix:
                description: Run fix routine
                required: true
                default: false
                type: boolean

            run_docs:
                description: Run docs build routine
                required: true
                default: false
                type: boolean

            run_api_report:
                description: Run API report update routine
                required: true
                default: false
                type: boolean

            repair_lockfile:
                description: >
                    Update pnpm-lock.yaml as needed to satisfy the manifests (pnpm install --no-frozen-lockfile) and commit the result. This is not a reset: the existing lockfile is updated, not deleted and re-resolved from scratch. Leave off and a stale lockfile fails the run instead of being rewritten silently.
                required: true
                default: false
                type: boolean

            commit_message_type:
                description: Conventional commit type prefix
                required: false
                default: chore
                type: choice
                options: [chore, style, docs, build, fix]

            commit_message_subject:
                description: Commit subject without type/scope.
                required: false
                default: workspace update
                type: string

permissions:
    contents: read

env:
    HUSKY: 0

jobs:
    guard:
        name: Guard
        runs-on: ubuntu-latest
        steps:
            - name: Refuse main and empty selection
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ "${{ github.ref_name }}" == "main" ]]; then
                    echo "::error::Workspace update cannot run on main. Checkout a feature or fix branch first."
                    exit 1
                  fi

                  if [[ "${{ inputs.run_fix }}" != "true" &&
                        "${{ inputs.run_docs }}" != "true" &&
                        "${{ inputs.run_api_report }}" != "true" &&
                        "${{ inputs.repair_lockfile }}" != "true" ]]; then
                    echo "::error::Select at least one routine: fix, docs, API report, or lockfile repair."
                    exit 1
                  fi

                  {
                    echo "## 🧰 Workspace update"
                    echo ""
                    echo "- branch: \`${{ github.ref_name }}\`"
                    echo "- fix: \`${{ inputs.run_fix }}\`"
                    echo "- docs: \`${{ inputs.run_docs }}\`"
                    echo "- api report: \`${{ inputs.run_api_report }}\`"
                    echo "- lockfile: \`${{ inputs.repair_lockfile && 'reconcile (repair, not reset)' || 'frozen (a stale lockfile fails the run)' }}\`"
                  } | tee -a "$GITHUB_STEP_SUMMARY"

    pipeline_workspace_update:
        name: Run selected pipeline routines
        needs: guard
        uses: gbtunney/snailicid3-actions/.github/workflows/call-pipeline.yml@v1
        with:
            mode: report
            check_mode: ${{ inputs.run_fix && 'fix' || 'skip' }}
            lockfile_mode: ${{ inputs.repair_lockfile && 'reconcile' || 'frozen' }}
            build_mode: skip
            test_mode: skip
            docs_mode: ${{ inputs.run_docs && 'report' || 'skip' }}
            api_report_mode: ${{ inputs.run_api_report && 'update' || 'skip' }}
            require_clean_repo: false
            upload_workspace_artifact: true
            artifact_name_prefix: workspace-update

    apply_workspace_artifact:
        name: Apply artifact and commit
        needs: pipeline_workspace_update
        if: ${{ needs.pipeline_workspace_update.result == 'success' && needs.pipeline_workspace_update.outputs.artifact_uploaded == 'true' }}
        permissions:
            contents: write
            actions: read
            id-token: write
        uses: gbtunney/snailicid3-actions/.github/workflows/call-apply-workspace-artifact.yml@v1
        secrets:
            GH_PAT: ${{ secrets.GH_PAT }}
        with:
            ref: ${{ github.ref_name }}
            artifact_name: ${{ needs.pipeline_workspace_update.outputs.workspace_artifact_name }}
            commit_mode: commit_if_dirty
            commit_message: "${{ format('{0}(root): {1}', inputs.commit_message_type, inputs.commit_message_subject) }}"
            scoped_commit_message: true
            push_branch: ${{ github.ref_name }}
