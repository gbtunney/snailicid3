# SYNCED from gbtunney/snailicid3-actions/templates/workflows — do not edit
# here. Change the template and re-run bin/sync-callers.sh.
# ─────────────────────────────────────────────────────────────
name: PR Checks

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: pr-${{ github.event.pull_request.number || github.ref_name }}
    # New PR runs may supersede stale validation. Reruns increment run_attempt,
    # so they queue instead of cancelling the healthy run already in this group.
    cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

permissions:
    contents: read

env:
    HUSKY: 0

jobs:
    merge_main:
        name: merge main
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'pull_request' }}
        steps:
            - name: Checkout pull request merge ref
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: refs/pull/${{ github.event.pull_request.number }}/merge

            - name: Confirm PR is mergeable with main
              shell: bash
              run: |
                  set -euo pipefail
                  echo "Checked out merge ref: refs/pull/${{ github.event.pull_request.number }}/merge"
                  git status --short
                  git rev-parse --verify HEAD

    # A pull request does exactly one thing about releases: run the canonical
    # release plan read-only and report it. call-release-observe.yml declares
    # contents: read and no secrets, so a PR cannot publish even by accident,
    # and there is no phase-dependent branching here to get wrong.
    release_observe:
        name: release plan (observe)
        uses: gbtunney/snailicid3-actions/.github/workflows/call-release-observe.yml@v2
        with:
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
            adapter_ref: v2

    validate:
        name: validate
        uses: gbtunney/snailicid3-actions/.github/workflows/call-pipeline.yml@v2
        with:
            checkout_ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
            mode: abort_on_error
            check_mode: check
            lockfile_mode: frozen
            build_mode: abort_on_error
            test_mode: abort_on_error
            docs_mode: abort_on_error
            api_report_mode: check
            require_clean_repo: true

    required:
        name: required
        runs-on: ubuntu-latest
        needs: [merge_main, release_observe, validate]
        if: ${{ always() }}
        steps:
            - name: Require PR checks to pass
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ "${{ github.event_name }}" == "pull_request" &&
                        "${{ needs.merge_main.result }}" != "success" ]]; then
                    echo "::error::PR merge ref check failed with result: ${{ needs.merge_main.result }}"
                    exit 1
                  fi

                  if [[ "${{ needs.release_observe.result }}" != "success" ]]; then
                    echo "::error::Release plan observation failed with result: ${{ needs.release_observe.result }}"
                    exit 1
                  fi

                  if [[ "${{ needs.validate.result }}" != "success" ]]; then
                    echo "::error::Validation pipeline failed with result: ${{ needs.validate.result }}"
                    exit 1
                  fi

                  # An observation that claimed publish authorization would mean
                  # the read-only guarantee had broken somewhere upstream.
                  if [[ "${{ needs.release_observe.outputs.should_publish }}" != "false" ]]; then
                    echo "::error::A pull request observation reported should_publish='${{ needs.release_observe.outputs.should_publish }}'. A PR must never authorize publication."
                    exit 1
                  fi

                  echo "Release phase: ${{ needs.release_observe.outputs.release_phase }} (observed, nothing authorized)"
                  echo "Pending inventory: ${{ needs.release_observe.outputs.release_inventory_count }}"
