# here. Change the template and re-run bin/sync-callers.sh.
# ─────────────────────────────────────────────────────────────
# Runs only after merge to `main`.
name: Push Release

on:
    push:
        branches:
            - main

concurrency:
    group: release-main
    cancel-in-progress: false

permissions:
    actions: write
    contents: write
    pull-requests: write
    id-token: write

env:
    HUSKY: 0
    NPM_CONFIG_PROVENANCE: true
    NX_NO_CLOUD: 'true'

jobs:
    release_plan:
        name: release plan
        uses: gbtunney/snailicid3-actions/.github/workflows/call-release-plan.yml@v1
        secrets:
            GH_PAT: ${{ secrets.GH_PAT }}
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
            ref: ''
            dry_run: true
            allow_non_main: false
            run_pipeline: true
            upload_workspace_artifact: true
            lockfile_mode: frozen
            node_version: lts/*
